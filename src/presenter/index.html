<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoPowerPoint — Presenter View</title>
  <link rel="stylesheet" href="katex.min.css">
  <link rel="stylesheet" href="presenter.css">
</head>
<body>
  <div class="presenter-container">
    <!-- Top Bar: Clock, Timer, Deck Title, Display Settings -->
    <header class="presenter-header">
      <div class="header-left">
        <h2 id="p-deck-title">Presentation Title</h2>
        <div class="display-settings-container">
          <button id="btn-display-settings" class="btn-header" title="Display Settings (Swap displays, Duplicate presentation)">
            🖥️ Display Settings ▾
          </button>
          <div id="display-settings-menu" class="display-settings-dropdown hidden">
            <button id="btn-swap-displays" class="dropdown-item" title="Swap Presenter View and Audience Slide Show (Shortcut: X)">
              <span class="dropdown-icon">🔄</span>
              <div class="dropdown-text">
                <span class="dropdown-label">Swap Presenter View and Slide Show</span>
                <span class="dropdown-hint">Shortcut: X</span>
              </div>
            </button>
            <button id="btn-duplicate-slideshow" class="dropdown-item" title="Duplicate clean presentation full-screen on all displays">
              <span class="dropdown-icon">🖥️</span>
              <div class="dropdown-text">
                <span class="dropdown-label">Duplicate Slide Show</span>
                <span class="dropdown-hint">Full-screen slides across all monitors</span>
              </div>
            </button>
            <button id="btn-auto-extend-toggle" class="dropdown-item" title="Automatically un-mirror external display when presenting">
              <span class="dropdown-icon" id="auto-extend-icon">✓</span>
              <div class="dropdown-text">
                <span class="dropdown-label">Auto-Extend Mirrored Displays</span>
                <span class="dropdown-hint">Matches Microsoft PowerPoint</span>
              </div>
            </button>
          </div>
          <button id="btn-end-slideshow" class="btn-header btn-header-danger" title="End Slide Show and exit presenter view (Shortcut: Esc)">
            ⏹ End Slide Show
          </button>
        </div>
      </div>

      <div class="header-center">
        <!-- Elapsed Timer -->
        <div class="timer-card">
          <span class="timer-label">ELAPSED</span>
          <span id="timer-display" class="timer-digits">00:00:00</span>
          <div class="timer-buttons">
            <button id="btn-timer-pause" class="btn-micro" title="Pause/Resume">⏸</button>
            <button id="btn-timer-reset" class="btn-micro" title="Reset Timer">↺</button>
          </div>
        </div>

        <!-- Real Wall Clock -->
        <div class="clock-card">
          <span class="clock-label">CLOCK</span>
          <span id="clock-display" class="clock-digits">12:00:00 PM</span>
        </div>
      </div>

      <div class="header-right">
        <!-- ADB Boox Tablet Badge -->
        <div class="adb-pill" id="adb-pill" title="Android Boox Tablet Status">
          <span class="adb-dot disconnected" id="adb-dot"></span>
          <span class="adb-label" id="adb-label">Boox: Disconnected</span>
          <button id="btn-adb-launch" class="btn-micro adb-launch-btn" title="Launch companion inking view on connected tablet" disabled>Open on Boox</button>
        </div>
        <span id="p-slide-counter" class="slide-indicator">Slide 1 of 1</span>
      </div>
    </header>

    <!-- Main Stage Grid -->
    <main class="presenter-grid">
      <!-- Left: Current Slide Live Preview -->
      <section class="panel current-slide-panel">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-badge">CURRENT SLIDE</span>
            <span id="current-slide-name" class="panel-subtext">Slide Title</span>
            <span id="live-audience-sync-badge" class="badge-audience-live" title="Live bidirectional synchronization with Audience Presentation">
              <span class="live-pulse-dot"></span> AUDIENCE SYNCED
            </span>
          </div>
          <div class="panel-ink-tools">
            <button id="btn-toggle-mirror" class="btn-micro active" title="Toggle Real-Time Audience Screen Mirror">👁️ Audience View</button>
            <button id="btn-p-ink-undo" class="btn-micro" title="Undo Ink Stroke">↩ Undo</button>
            <button id="btn-p-ink-clear" class="btn-micro" title="Clear Slide Ink">🗑 Clear Ink</button>
          </div>
        </div>
        <div class="preview-viewport" id="current-viewport">
          <div class="preview-scaler" id="current-scaler">
            <iframe id="current-frame" class="preview-iframe"></iframe>
            <img id="current-mirror" class="preview-mirror" alt="Live Audience Screen" style="display: none;">
          </div>
        </div>
      </section>

      <!-- Right Column: Next Slide Preview + Speaker Notes -->
      <section class="panel side-panel">
        <!-- Next Slide Preview -->
        <div class="next-slide-section">
          <div class="panel-header">
            <span class="panel-badge badge-next">NEXT SLIDE</span>
            <span id="next-slide-name" class="panel-subtext">Next Title</span>
          </div>
          <div class="preview-viewport" id="next-viewport">
            <div class="preview-scaler" id="next-scaler">
              <iframe id="next-frame" class="preview-iframe"></iframe>
            </div>
          </div>
        </div>

        <!-- Speaker Notes -->
        <div class="notes-section">
          <div class="panel-header">
            <span class="panel-badge badge-notes">SPEAKER NOTES</span>
            <div class="notes-tools">
              <button id="btn-notes-smaller" class="btn-micro" title="Decrease font size">A-</button>
              <button id="btn-notes-larger" class="btn-micro" title="Increase font size">A+</button>
              <button id="btn-notes-math-toggle" class="btn-micro active" title="Toggle Math Equations Preview">∑</button>
            </div>
          </div>
          <div id="p-notes-content" class="notes-body">
            <p class="notes-placeholder">No speaker notes for this slide.</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <footer class="presenter-footer">
      <button id="btn-p-prev" class="btn-nav" title="Previous Slide (Left Arrow)">‹ Previous</button>
      <div id="slide-strip" class="slide-strip">
        <!-- Thumbnails / Pills for each slide -->
      </div>
      <button id="btn-p-next" class="btn-nav btn-nav-primary" title="Next Slide (Right Arrow / Space)">Next ›</button>
    </footer>
  </div>

  <script type="module" src="presenter.js"></script>
</body>
</html>
